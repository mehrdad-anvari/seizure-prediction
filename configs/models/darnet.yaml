# DARNet (Yan et al., NeurIPS 2024) on CHB-MIT prediction windows.
#
# Baseline: configs/studies/study003.yaml. Deltas:
#   - offline_transforms drops `wavelet_filterbank`; DARNet consumes the raw
#     `(B, C, T)` window and its dual attention operates along real time, which
#     the wavelet filterbank's `concat_time` layout destroys.
#   - `in_channels` / `chunk_size` are explicit: DARNet sizes its spatial and
#     temporal projections from them (they are never inferred from the data).
#
# Training recipe: unchanged from study003. DARNet's published recipe is for
# auditory attention decoding, not seizure prediction, and that paper is not in
# `papers/` (only its reference implementation, `papers/darnet.py`), so there is
# no paper-specified loss/optimizer to copy here.

task: prediction
seed: 42
device: cuda
epochs: 50
amp: true
grad_clip_norm: 1.0
log_every: 10
save_dir: runs
run_name: darnet

data:
  name: chbmit_npz
  dataset_dir: data/BIDS_CHB-MIT
  subject_id: "01"
  task: prediction
  batch_size: 32
  num_workers: 4
  use_uint16: false
  dataloader_type: "undersample"
  suffix: _fd_5s_prex5
  kwargs:
    offline_transforms: ["robust_norm"]

monitor: auc
monitor_mode: max

cv:
  outer_method: "LOO"
  outer_shuffle: false
  outer_n_fold: 8
  outer_mode: "split"
  outer_M: 10
  inner_method: "KFold"
  inner_n_fold: 5
  inner_shuffle: false
  inner_mode: "per_event_strata"
  inner_M: 10
  random_state: 42

model:
  name: darnet
  num_classes: 1
  in_channels: 18
  kwargs:
    chunk_size: 640        # 5 s x 128 Hz
    d_model: 16            # must be divisible by num_heads
    num_heads: 8
    attn_dropout: 0.1

loss:
  name: bce_logits
  kwargs: {}

optim:
  name: adamw
  lr: 0.0001
  weight_decay: 0.01
  kwargs: {}

sched:
  name: null
  kwargs: {}
